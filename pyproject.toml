[project]
name = "podcast-bot"
version = "1.0"
description = "A Telegram bot that helps users easily download audio from YouTube videos"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "aiobotocore>=3.10.0",
    "beanie>=2.2.0",
    "pydantic-settings>=2.14.0",
    "yt-dlp[default]>=2026.11.4",
    "fluentogram>=1.2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.99",
    "types-aiobotocore[essential]>=3.10.0",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ty.environment]
python-version = "3.13"
